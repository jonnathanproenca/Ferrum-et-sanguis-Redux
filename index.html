<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferrum et Sanguis</title>
    <style>
      :root {
        --bg: #120c0a;
        --painel: #1d1411;
        --borda: #4a2a1e;
        --ocre: #c2895a;
        --ouro: #f2d28a;
        --sangue: #8a1c1c;
        --areia: #e8d5b0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(ellipse at 50% 0%, #3a1a12 0%, transparent 60%),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 6px),
          var(--bg);
        color: var(--areia);
        font-family: Georgia, 'Times New Roman', serif;
      }
      #game {
        visibility: hidden;
        position: fixed;
        inset: 0;
        z-index: 5;
        background: var(--bg);
      }
      #game.ativo { visibility: visible; }
      #ui { max-width: 1000px; margin: 0 auto; padding: 16px; }
      #ui[hidden] { display: none; }



      /* ---------- Tutorial ---------- */
      .tutorial-fundo { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 16px; background: rgba(5,3,2,.78); }
      .tutorial { max-width: 460px; width: 100%; padding: 18px 20px; background: linear-gradient(180deg, #2a1812, #170d09); border: 2px solid #c9a24a; box-shadow: 0 0 0 4px #130c09, 0 20px 50px rgba(0,0,0,.7); color: #e8d5b0; }
      .tutorial small { color: #c9a24a; letter-spacing: .15em; text-transform: uppercase; font-size: .7rem; }
      .tutorial h3 { margin: 4px 0 8px; font-weight: normal; font-size: 1.35rem; color: #f2e6c8; }
      .tutorial p { margin: 0 0 14px; line-height: 1.45; }
      .tutorial-acoes { display: flex; gap: 10px; justify-content: flex-end; }

      /* ---------- Campanha ---------- */
      .camp { max-width: 1100px; margin: 0 auto; }
      .camp-cabeca { text-align: center; margin: 4px 0 6px; }
      .camp-cabeca small { color: #c9a24a; letter-spacing: .25em; text-transform: uppercase; font-size: .72rem; }
      .camp-cabeca h2 { margin: 0; font-weight: normal; font-size: clamp(1.4rem, 4.5vw, 2.4rem); color: #f2e6c8; letter-spacing: .06em; text-shadow: 0 2px 0 #000, 0 0 18px rgba(138,28,28,.8); }
      .camp-trilha { display: flex; justify-content: center; gap: 0; list-style: none; padding: 0; margin: 0 0 10px; }
      .camp-trilha li { display: flex; align-items: center; }
      .camp-trilha li + li::before { content: ''; width: clamp(8px, 3vw, 26px); height: 2px; background: #3a2a20; }
      .camp-trilha b { width: 26px; height: 26px; display: grid; place-items: center; font-weight: normal; font-size: .75rem; border-radius: 50%; border: 2px solid #3a2a20; color: #7a6650; background: #140d0a; }
      .camp-trilha .feito b { border-color: #c9a24a; color: #1a0f08; background: #c9a24a; }
      .camp-trilha .feito + li::before, .camp-trilha .atual + li::before { background: #3a2a20; }
      .camp-trilha .atual b { border-color: #d6452f; color: #fff; background: #8a1c1c; box-shadow: 0 0 10px #d6452f; animation: camp-pulsa 1.6s ease-in-out infinite; }
      @keyframes camp-pulsa { 50% { box-shadow: 0 0 18px #ff6a4a; } }
      .camp-palco .sel-info { top: 3%; }
      .camp-fig { bottom: 12%; cursor: default; pointer-events: none; }
      .camp-fig.vencido { filter: grayscale(1) brightness(.55) drop-shadow(0 6px 4px rgba(0,0,0,.55)); }
      .camp-fig.vencido::after { content: '✕'; position: absolute; left: 50%; top: 40%; transform: translateX(-50%); color: #d6452f; font-size: clamp(1rem, 4vw, 2rem); text-shadow: 0 0 6px #000; }
      .camp-fig.futuro { filter: brightness(0) drop-shadow(0 0 3px rgba(201,162,74,.35)); opacity: .55; }
      .camp-fig.ativo { transform: translateY(-5%) scale(1.06); }
      .camp-num { position: absolute; left: 50%; bottom: -12%; transform: translateX(-50%); min-width: 1.6em; text-align: center; background: rgba(15,9,6,.88); border: 1px solid #c9a24a; color: #f2e6c8; font-size: clamp(.6rem, 1.5vw, .85rem); padding: 1px 4px; }
      .camp-fig .camp-nome { position: absolute; left: 50%; bottom: -13%; transform: translateX(-50%); white-space: nowrap; background: rgba(15,9,6,.88); border: 1px solid #c9a24a; padding: 2px 10px; color: #f2e6c8; font-size: clamp(.6rem, 1.6vw, .95rem); text-align: center; }
      .camp-fig .camp-nome small { display: block; color: #c9a24a; font-size: .8em; }
      .camp-duelo { margin: 12px 0; padding: 14px; text-align: center; background: linear-gradient(180deg, #2a1812, #170d09); border: 2px solid #c9a24a; box-shadow: 0 0 0 4px #130c09, 0 10px 30px rgba(0,0,0,.6); }
      .camp-duelo.nemesis { border-color: #d6452f; box-shadow: 0 0 0 4px #130c09, 0 0 26px rgba(214,69,47,.55); }
      .camp-lados { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
      .camp-lado { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: end; }
      .camp-lado small { flex-basis: 100%; color: #b59a72; }
      .camp-lutador { display: flex; flex-direction: column; align-items: center; width: 110px; color: #f2e6c8; font-size: .85rem; }
      .camp-lutador .gladiador-img { height: 132px; width: auto; }
      .camp-vs { font-size: clamp(2rem, 8vw, 3.6rem); color: #d6452f; text-shadow: 0 0 14px rgba(214,69,47,.7), 0 3px 0 #000; letter-spacing: .05em; line-height: 1; }
      .camp-vs small { display: block; font-size: .3em; color: #c9a24a; text-shadow: none; }
      .camp-regra { margin: 10px 0 4px; color: #e8d5b0; }
      .camp-regra strong { display: block; color: #f2d28a; font-size: 1.05rem; }
      .camp-morte { color: #ff8a72; margin: 4px 0 8px; font-style: italic; }
      .camp-entrar { width: 100%; font-size: 1.15rem; letter-spacing: .08em; text-transform: uppercase; }
      .camp-fim { text-align: center; padding: 40px 16px; border: 2px solid #c9a24a; background: #170d09; color: #f2e6c8; }

      /* ---------- Escolha do lanista ---------- */
      .selecao-lanistas { max-width: 1100px; margin: 0 auto; }
      .sel-palco {
        position: relative; width: 100%; aspect-ratio: 1376 / 768; overflow: hidden;
        background-size: 100% 100%; image-rendering: pixelated;
        border: 3px solid var(--ouro); border-radius: 4px; box-shadow: 0 0 0 5px #130c09, 0 20px 50px rgba(0,0,0,0.6);
      }
      .sel-palco::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(10,6,4,0.78) 0%, rgba(10,6,4,0.45) 22%, transparent 36%); }
      .sel-info { position: absolute; z-index: 30; left: 50%; top: 2.2%; transform: translateX(-50%); width: 62%; text-align: center; text-shadow: 0 2px 4px #000, 0 0 8px #000; }
      .sel-info h2 { margin: 0; font-size: clamp(1.1rem, 3.2vw, 2.1rem); font-weight: normal; color: #f2e6c8; letter-spacing: .03em; }
      .sel-info p { margin: 2px 0 0; font-size: clamp(.65rem, 1.5vw, 1rem); line-height: 1.3; color: #e8d5b0; }
      .sel-info .sel-titulo { color: #f2d28a; font-style: italic; }
      .sel-info .sel-esp { color: #c9a24a; }
      .sel-info .sel-bonus { color: #ffe9a8; }
      .lanista-sel {
        position: absolute; bottom: 13%; padding: 0; background: none; border: 0; cursor: pointer;
        transition: transform .15s, filter .2s; filter: drop-shadow(0 6px 4px rgba(0,0,0,0.55));
      }
      .lanista-sel img { display: block; width: 100%; height: auto; image-rendering: pixelated; pointer-events: none; }
      .lanista-sel.apagado { filter: grayscale(1) brightness(.62) drop-shadow(0 6px 4px rgba(0,0,0,0.55)); }
      .lanista-sel:hover { transform: translateY(-3%); filter: none; }
      .lanista-sel.apagado:hover { filter: grayscale(.4) brightness(.85) drop-shadow(0 6px 4px rgba(0,0,0,0.55)); }
      .lanista-sel.ativo { transform: translateY(-4%) scale(1.04); filter: drop-shadow(0 0 6px #f2c230) drop-shadow(0 0 14px rgba(242,194,48,0.8)); }
      .lanista-sel:focus-visible { outline: 2px dashed #f2d28a; outline-offset: 2px; }
      .sel-acoes { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 14px; }
      .sel-info-m { display: none; }
      .sel-regras { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; margin-top: 12px; }
      .sel-regras .meta { flex-basis: 100%; text-align: center; margin: 0; }
      .dificuldades { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .card.arena.fechada { opacity: .55; filter: grayscale(.7); }
      @media (max-width: 720px) {
        .sel-palco .sel-info { display: none; }
        .sel-palco::after { display: none; }
        .sel-info-m { display: block; margin-top: 10px; text-align: center; }
        .sel-info-m h2 { margin: 0; font-size: 1.3rem; font-weight: normal; color: #f2e6c8; }
        .sel-info-m p { margin: 3px 0; font-size: .85rem; color: #e8d5b0; }
        .sel-info-m .sel-titulo { color: #f2d28a; font-style: italic; }
        .sel-info-m .sel-esp { color: #c9a24a; }
        .sel-info-m .sel-bonus { color: #ffe9a8; }
        .sel-acoes { flex-direction: column-reverse; }
        .sel-acoes .btn { width: 100%; }
      }

      /* ---------- Menu ---------- */
      .menu { display: flex; justify-content: center; padding: 24px 0; }
      .moldura {
        position: relative;
        width: 100%;
        max-width: 520px;
        padding: 28px 24px 24px;
        text-align: center;
        background: linear-gradient(180deg, #241812 0%, #130c09 100%);
        border: 3px solid var(--ouro);
        border-radius: 4px;
        box-shadow: 0 0 0 6px #130c09, 0 0 0 8px #8a5a1e, 0 30px 60px rgba(0,0,0,0.6);
      }
      .moldura::before, .moldura::after {
        content: '';
        position: absolute;
        left: 10px; right: 10px;
        height: 6px;
        background: repeating-linear-gradient(90deg, var(--sangue) 0 10px, transparent 10px 16px);
        opacity: 0.8;
      }
      .moldura::before { top: 10px; }
      .moldura::after { bottom: 10px; }
      .emblema { width: 120px; height: 120px; margin: 0 auto 4px; display: block; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7)); }
      h1 {
        margin: 6px 0 4px;
        font-size: 2.2rem;
        font-weight: normal;
        letter-spacing: 6px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffe6a8 0%, #c2892f 55%, #7a3a12 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 0 #000);
      }
      .sub { color: var(--ocre); margin: 0 0 18px; font-style: italic; }
      .bloco { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; align-items: center; }
      .bloco label { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 340px; font-size: 0.9rem; color: var(--ocre); }
      .bloco select { width: 100%; }

      /* ---------- Jogo ---------- */
      .topo {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        align-items: center;
        padding: 10px 14px;
        background: linear-gradient(180deg, #2a1a14, var(--painel));
        border-bottom: 2px solid var(--sangue);
        border-radius: 6px;
      }
      .topo strong { color: var(--ouro); font-weight: normal; letter-spacing: 1px; }
      .abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      .abas .ativa { background: var(--sangue); border-color: var(--ouro); }
      .card {
        background: linear-gradient(180deg, #211612, var(--painel));
        border: 1px solid var(--borda);
        border-radius: 8px;
        padding: 12px;
      }
      .card h3 { margin: 0 0 6px; font-size: 1.05rem; font-weight: normal; }
      .card h3 small { color: var(--ocre); font-size: 0.8rem; }
      .card.morto { opacity: 0.45; }
      .card.desafio { border-color: var(--ocre); margin-bottom: 12px; }
      .card.desafio.nemesis { border-color: var(--sangue); box-shadow: 0 0 14px rgba(138,28,28,0.4); }
      .card.arena { padding: 0 0 12px; overflow: hidden; }
      .card.arena h3, .card.arena .meta, .card.arena .aviso, .card.arena .btn { margin-left: 12px; margin-right: 12px; }
      .card.arena .btn { margin-bottom: 0; }
      .arte { height: 120px; overflow: hidden; border-bottom: 1px solid var(--borda); margin-bottom: 10px; }
      .arte img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .passiva { font-size: 0.85rem; color: var(--areia); margin: 4px 0; opacity: 0.9; }
      .stats { font-family: 'Courier New', monospace; color: var(--ocre); margin: 4px 0; }
      .meta { font-size: 0.85rem; opacity: 0.85; margin: 4px 0; }
      .efeitos { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      .efeito {
        font-size: 0.75rem;
        padding: 2px 6px;
        border: 1px solid #a33;
        border-radius: 10px;
        background: #3a1010;
        color: #ffb3a0;
      }
      .requisitos { list-style: none; padding: 0; margin: 4px 0 10px; font-size: 0.9rem; }
      .requisitos .ok { color: #9be05a; }
      .requisitos .falta { color: #d88a6a; }
      .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
      .botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      .linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
      .rodape { margin-top: 16px; }
      .btn {
        background: linear-gradient(180deg, #33201a, #1f130f);
        color: var(--areia);
        border: 1px solid var(--ocre);
        border-radius: 6px;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .btn:hover:not(:disabled) { border-color: var(--ouro); color: var(--ouro); }
      .btn.primario { background: linear-gradient(180deg, #a12626, var(--sangue)); border-color: #c24a3a; }
      .btn.grande { padding: 12px 20px; font-size: 1rem; letter-spacing: 1px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      select {
        background: var(--bg);
        color: var(--areia);
        border: 1px solid var(--ocre);
        border-radius: 4px;
        padding: 6px;
        max-width: 100%;
        font-family: inherit;
      }
      .aviso { color: var(--ocre); font-weight: bold; }
      .registro { margin-top: 16px; font-size: 0.85rem; }
      .registro li { margin: 3px 0; }
      /* ---------- Gladiadores ---------- */
      .escalacao { background: #1c1411; border: 1px solid #4a3020; border-radius: 10px; padding: 10px 12px; margin: 10px 0 14px; }
      .escalacao > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .escalacao > header .btn { margin-left: auto; }
      .escolhidos { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; min-height: 26px; align-items: center; }
      .escolhido { background: #2a1c15; border: 1px solid #c9a24a; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
      .escolhido b { color: #c9a24a; margin-right: 4px; }
      .faixa { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 10px; scroll-snap-type: x proximity; }
      .escala { position: relative; flex: 0 0 104px; background: #14100d; border: 2px solid #3a2a20; border-radius: 10px; padding: 6px 6px 8px; cursor: pointer; color: inherit; text-align: center; scroll-snap-align: start; font: inherit; }
      .escala .thumb { float: none; width: 84px; margin: 0 auto 4px; }
      .escala strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .escala small { display: block; color: #a8957f; font-size: 11px; line-height: 1.2; }
      .escala:hover:not(:disabled) { border-color: #7a5a3a; }
      .escala.marcado { border-color: #c9a24a; box-shadow: 0 0 0 1px #c9a24a inset, 0 0 12px rgba(201,162,74,0.35); }
      .escala:disabled { opacity: 0.4; cursor: not-allowed; }
      .escala .num { position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border-radius: 50%; background: #c9a24a; color: #120c0a; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 13px; }
      /* ----- Ludus: cena no alto do morro ----- */
      .ludus-wrap { overflow-x: auto; margin: 6px 0 14px; border: 1px solid var(--borda); border-radius: 10px; }
      .ludus-cena { position: relative; min-width: 760px; aspect-ratio: 1024 / 572; background: #2a1a18; overflow: hidden; border-radius: 10px; user-select: none; }
      .ludus-cena > * { position: absolute; }
      .ludus-base, .ludus-camada { display: block; image-rendering: pixelated; pointer-events: none; }
      .ludus-base { inset: 0; width: 100%; height: 100%; }
      .ludus-sprite { image-rendering: pixelated; pointer-events: none; height: auto; }
      .ludus-sprite.espelhado { transform: scaleX(-1); }
      .ludus-sprite.treina { animation: ludus-treina 3.4s ease-in-out infinite alternate; }
      @keyframes ludus-treina { from { translate: -5px 0; } 50% { translate: 0 -2px; } to { translate: 5px 0; } }
      .doctore { position: absolute; pointer-events: none; left: 0; animation: doctore-anda 16s linear infinite alternate; }
      .doctore-corpo { position: relative; animation: doctore-vira 32s steps(1) infinite; }
      .doctore-corpo img { display: block; width: 100%; height: auto; image-rendering: pixelated; animation: doctore-passo 0.5s ease-in-out infinite alternate; }
      @keyframes doctore-anda { from { left: 24%; } to { left: 58%; } }
      @keyframes doctore-vira { 0%, 49.99% { transform: scaleX(1); } 50%, 100% { transform: scaleX(-1); } }
      @keyframes doctore-passo { from { translate: 0 0; } to { translate: 0 -2px; } }
      .doctore .chicote { position: absolute; left: 80%; top: 24%; width: 210%; height: auto; opacity: 0; transform-origin: 0 70%; }
      .doctore.estala .chicote { animation: chicote-estala 0.5s ease-out; }
      @keyframes chicote-estala { 0% { opacity: 0; transform: scale(0.3) rotate(25deg); } 25% { opacity: 1; transform: scale(1) rotate(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05) rotate(-4deg); } }
      /* ----- Ludus: obras (tábuas, parede, ícones) ----- */
      .upgrade.feito { opacity: 0.75; }
      .construida-selo { display: inline-block; padding: 4px 12px; border-radius: 999px; border: 1px solid #8fbf7a; color: #8fbf7a; font-size: 13px; }
      .tabuas { z-index: 3; pointer-events: none; }
      .tabua { position: absolute; left: -8%; width: 116%; height: 24%; border: 2px solid #26140a; border-radius: 2px; transform: rotate(var(--r, 0deg));
        background: repeating-linear-gradient(90deg, #7b5232 0 7px, #6a4426 7px 8px, #8a5d3b 8px 17px, #5f3d22 17px 18px);
        box-shadow: 0 3px 4px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
      .tabua::before, .tabua::after { content: ''; position: absolute; top: 38%; width: 4px; height: 4px; border-radius: 50%; background: #c8c8c8; box-shadow: 0 1px 0 #333; }
      .tabua::before { left: 6%; } .tabua::after { right: 6%; }
      .arranca .tabua { animation: tabua-arranca 1.5s ease-in both; animation-delay: calc(var(--d, 0s) - var(--decorrido, 0s)); }
      .compra .arranca .tabua { animation-delay: calc(var(--d, 0s) - var(--decorrido, 0s)); }
      @keyframes tabua-arranca {
        0% { transform: rotate(var(--r)); opacity: 1; }
        30% { transform: rotate(var(--r)); opacity: 1; }
        100% { transform: translate(var(--vx), 320%) rotate(var(--rf)); opacity: 0; }
      }
      .fade-compra { animation: ludus-aparece 1.3s ease-out both; animation-delay: calc(var(--d, 0s) - var(--decorrido, 0s)); }
      @keyframes ludus-aparece { from { opacity: 0; filter: brightness(2.2); } to { opacity: 1; filter: none; } }
      .poeira { z-index: 3; pointer-events: none; }
      .poeira i { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(220, 200, 165, 0.9), rgba(220, 200, 165, 0) 70%); animation: poeira-sobe 1.8s ease-out both; animation-delay: calc(var(--p, 0s) - var(--decorrido, 0s)); }
      .poeira i:nth-child(1) { left: 5%; top: 30%; width: 45%; height: 60%; --p: 0s; }
      .poeira i:nth-child(2) { left: 35%; top: 15%; width: 50%; height: 70%; --p: 0.12s; }
      .poeira i:nth-child(3) { left: 55%; top: 35%; width: 45%; height: 55%; --p: 0.25s; }
      @keyframes poeira-sobe { 0% { opacity: 0; transform: scale(0.5); } 18% { opacity: 0.95; } 100% { opacity: 0; transform: scale(1.7) translateY(-18%); } }
      .icone-ludus { z-index: 3; width: 36px; height: 36px; margin: -18px 0 0 -18px; padding: 6px; border-radius: 50%; cursor: pointer; color: #f2d28a; background: rgba(20, 12, 9, 0.88); border: 2px solid #f2d28a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
      .icone-ludus svg { display: block; width: 100%; height: 100%; }
      .icone-ludus:hover, .icone-ludus.aberta { background: #3a2a14; border-color: #fff0a0; }
      .icone-ludus.pop { animation: icone-pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both; animation-delay: calc(1.9s - var(--decorrido, 0s)); }
